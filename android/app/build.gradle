apply plugin: 'com.android.application'

// Данные для подписи хранятся ВНЕ репозитория: android/keystore.properties
// Шаблон для новых машин — android/keystore.properties.example
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasSigning = keystorePropsFile.exists() && keystoreProps['storeFile']

android {
    namespace 'ru.umort.gopher'
    compileSdkVersion 34
    
    defaultConfig {
        applicationId "ru.umort.gopher"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 71
        versionName "1.4.27"
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src * data: blob: gap: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'; media-src *; img-src * data: blob:;">
<meta name="format-detection" content="telephone=no">
<meta name="msapplication-tap-highlight" content="no">
<title>Gopher Life</title>
<link rel="stylesheet" href="css/style.css">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1a1a2e;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#gameCanvas {
  display: block;
  width: 100%;
  height: 100%;
}
#achievement-popup {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(46, 204, 113, 0.96);
  color: #fff;
  padding: 14px 26px;
  border-radius: 14px;
  font-size: 17px;
  font-weight: bold;
  z-index: 1000;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
#achievement-popup.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#achievement-popup .ach-emoji { font-size: 22px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="achievement-popup"><span class="ach-emoji">🎉</span><span class="ach-text"></span></div>

<!-- Базовые утилиты -->
<script src="js/helpers.js"></script>

<!-- Главный персонаж -->
<script src="js/gopher.js"></script>

<!-- Система характеристик -->
<script src="js/system.js"></script>

<!-- База контента локаций (экспонаты, книги, задания...) -->
<script src="js/game_content.js"></script>
<script src="js/game_room.js"></script>
<script src="js/game_scenery.js"></script>

<!-- Аудиосистема -->
<script src="js/audio.js"></script>

<!-- Сцены -->
<script src="js/game_menu.js"></script>
<script src="js/game_map.js"></script>
<script src="js/game_home.js"></script>
<script src="js/game_shop.js"></script>
<script src="js/game_minigames.js"></script>
<script src="js/game_stats.js"></script>
<script src="js/game_clinic.js"></script>
<script src="js/game_visit.js"></script>
<script src="js/game_friends.js"></script>

<!-- Главный файл игры -->
<script src="js/game.js"></script>

<!-- ЗАПУСК ИГРЫ -->
<script>
  window.addEventListener('load', function() {
    const game = new Game();
    game.init();
  });
</script>
</body>
</html>

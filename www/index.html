<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src * data: blob: gap: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'; media-src *; img-src * data: blob:;">
<meta name="format-detection" content="telephone=no">
<meta name="msapplication-tap-highlight" content="no">
<title>Gopher Life</title>
<link rel="stylesheet" href="css/style.css">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1a1a2e;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#gameCanvas {
  display: block;
  width: 100%;
  height: 100%;
}
#achievement-popup {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  /* Длинные объяснения («Гофер устал — поспи…», «Гофер спит 💤 — …») должны
     переноситься по строкам, а не растягивать плашку за края экрана. */
  max-width: min(92vw, 460px);
  box-sizing: border-box;
  text-align: center;
  line-height: 1.3;
  background: rgba(46, 204, 113, 0.96);
  color: #fff;
  padding: 14px 26px;
  border-radius: 14px;
  font-size: 17px;
  font-weight: bold;
  z-index: 1000;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
#achievement-popup.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#achievement-popup .ach-emoji { font-size: 22px; }
/* Панель для кода друга: настоящие поля ввода — WebView умеет их копировать
   и вставлять штатным меню Android (в canvas это невозможно). */
#clipPanel {
  display: none;
  position: fixed;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  width: min(94vw, 480px);
  box-sizing: border-box;
  background: #1f2438;
  border: 2px solid #FFD93D;
  border-radius: 14px;
  padding: 12px 12px 10px;
  z-index: 900;
  box-shadow: 0 8px 28px rgba(0,0,0,0.45);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #fff;
}
#clipPanel #clipTitle { font-size: 14px; font-weight: bold; color: #FFD93D; margin-bottom: 6px; }
#clipPanel #clipHint { font-size: 11.5px; color: #c9cfe0; margin-top: 6px; line-height: 1.35; }
#clipPanel textarea {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 4px 0;
  padding: 8px;
  font: 13px/1.4 monospace;
  color: #10121c;
  background: #f4f6ff;
  border: 1px solid #8d93a8;
  border-radius: 8px;
  resize: none;
  min-height: 44px;
  /* Важно: выделение и системное меню Android должны работать */
  -webkit-user-select: text;
  user-select: text;
  touch-action: auto;
  -webkit-touch-callout: default;
}
#clipPanel #clipField2 { min-height: 40px; }
#clipBtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#clipBtns button {
  flex: 1 1 auto;
  min-width: 104px;
  padding: 10px 8px;
  font-size: 13px;
  font-weight: bold;
  color: #10121c;
  background: #FFD93D;
  border: none;
  border-radius: 10px;
  touch-action: manipulation;
}
#clipBtns button#clipCloseBtn { background: #9aa3bd; }
#clipBtns button#clipCopyBtn { background: #7FD1F5; }
#clipBtns button#clipSubmitBtn { background: #6BCB77; }
#chatPanel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 850;
  touch-action: auto;
  box-sizing: border-box;
  background: #1a2140;
  color: #fff;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  flex-direction: column;
  padding: 10px 10px 12px;
}
#chatPanel.open { display: flex; }
#chatHead { color: #FFD93D; font-weight: bold; font-size: 22px; text-align: center; margin-bottom: 8px; }
#chatLog {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 8px;
}
.chat-row { margin: 6px 0; display: flex; }
.chat-row.me { justify-content: flex-end; }
.chat-bubble {
  max-width: 86%;
  padding: 8px 10px;
  border-radius: 12px;
  line-height: 1.35;
  font-size: 20px;
  -webkit-user-select: text;
  user-select: text;
}
.chat-row.me .chat-bubble { background: #4D96FF; }
.chat-row.pet .chat-bubble { background: #2e3b63; }
#chatForm { display: flex; gap: 6px; margin-top: 8px; width: 100%; min-width: 0; }
#chatInput {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  font-size: 18px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #8d93a8;
  -webkit-user-select: text;
  user-select: text;
  touch-action: auto;
}
#chatForm button, #chatClose {
  font-weight: bold;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  padding: 12px 10px;
  touch-action: manipulation;
}
#chatForm button { flex: 0 0 auto; white-space: nowrap; }
#chatForm button { background: #6BCB77; color: #102014; }
#chatClose { margin-top: 6px; background: #9aa3bd; color: #10121c; }
#kitBar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; gap: 8px; padding: 8px; background: #10221f; }
#kitBar.open { display: flex; align-items: flex-end; }
#kitBar.multi { flex-wrap: wrap; }
#kitInput { flex: 1; font-size: 18px; padding: 10px; border-radius: 10px; border: 0; }
#kitNote { display: none; width: 100%; height: 58vh; max-height: none; min-height: 180px; font-size: 17px; padding: 10px; border-radius: 10px; border: 0; resize: none; box-sizing: border-box; }
#kitBar.multi #kitInput { display: none; }
#kitBar.multi #kitNote { display: block; }
#kitOk { font-weight: bold; font-size: 16px; border: 0; border-radius: 10px; padding: 10px 14px; background: #6BCB77; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="achievement-popup"><span class="ach-emoji">🎉</span><span class="ach-text"></span></div>

<!-- Панель обмена кодами друзей: настоящие поля ввода (копирование/вставка) -->
<div id="clipPanel">
  <div id="clipTitle"></div>
  <textarea id="clipField" rows="2" spellcheck="false" autocomplete="off"></textarea>
  <textarea id="clipField2" rows="2" spellcheck="false" autocomplete="off" style="display:none"></textarea>
  <div id="clipHint"></div>
  <div id="clipBtns">
    <button id="clipCopyBtn" type="button">📋 Скопировать</button>
    <button id="clipPasteBtn" type="button">📤 Отправить</button>
    <button id="clipSubmitBtn" type="button" style="display:none">➕ Добавить</button>
    <button id="clipCloseBtn" type="button">Готово</button>
  </div>
</div>

<div id="kitBar">
  <textarea id="kitNote" maxlength="4000" placeholder="Заметка"></textarea>
  <input id="kitInput" type="text" maxlength="400" autocomplete="off" placeholder="Текст">
  <button id="kitOk" type="button">Ок</button>
</div>
<div id="chatPanel">
  <div id="chatHead">Чат</div>
  <div id="chatLog"></div>
  <form id="chatForm">
    <input id="chatInput" type="text" maxlength="180" autocomplete="off" placeholder="Напиши сообщение">
    <button type="submit">Сказать</button>
  </form>
  <button id="chatClose" type="button">← Назад домой</button>
</div>

<!-- Базовые утилиты -->
<script src="js/helpers.js"></script>

<!-- Главный персонаж и другие игрушки (задел: герой — не только гофер) -->
<script src="js/gopher.js"></script>
<script src="js/characters.js"></script>

<!-- Система характеристик -->
<script src="js/system.js"></script>

<!-- База контента локаций (экспонаты, книги, задания...) -->
<script src="js/game_content.js"></script>
<script src="js/game_room.js"></script>
<script src="js/game_scenery.js"></script>

<!-- Аудиосистема -->
<script src="js/audio.js"></script>

<!-- Сцены -->
<script src="js/game_menu.js"></script>
<script src="js/game_map.js"></script>
<script src="js/game_home.js"></script>
<script src="js/game_shop.js"></script>
<script src="js/game_minigames.js"></script>
<script src="js/chat_lines.js"></script>
<script src="js/chat_kid.js"></script>
<script src="js/semantic.js"></script>
<script src="js/chat_semantic.js"></script>
<script src="js/chat_bank.js"></script>
<script src="js/chat_talk.js"></script>
<script src="js/chat_memory.js"></script>
<script src="js/game_chat.js"></script>
<script src="js/game_tools.js"></script>
<script src="js/game_quiet.js"></script>
<script src="js/game_aerial.js"></script>
<script src="js/game_stats.js"></script>
<script src="js/game_clinic.js"></script>
<script src="js/game_visit.js"></script>
<script src="js/game_friends.js"></script>

<!-- Главный файл игры -->
<script src="js/game.js"></script>

<!-- ЗАПУСК ИГРЫ -->
<script>
  window.addEventListener('load', function() {
    const game = new Game();
    game.init();
  });
</script>
</body>
</html>

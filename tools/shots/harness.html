<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gopher Life — стенд проверки рендера</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#1a1a2e; }
  #gameCanvas { display:block; width:100%; height:100%; }
  #report { position:fixed; left:-9999px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<pre id="report">{}</pre>
<pre id="shot"></pre>

<script>
// ── ДИАГНОСТИКА: ошибки видны на самом скриншоте ──────────────────────────
window.__log = [];
function show(msg, bg) {
  window.__log.push(msg);
  var d = document.getElementById('diag');
  if (!d) {
    d = document.createElement('pre');
    d.id = 'diag';
    d.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:99999;margin:0;padding:8px;' +
                      'background:#300;color:#ff9;font:11px/1.4 monospace;white-space:pre-wrap';
    document.body.appendChild(d);
  }
  d.style.background = bg || '#300';
  d.textContent = window.__log.slice(-10).join('\n');
}
window.onerror = function (m, src, line, col) {
  show('JS ERROR: ' + m + '  @' + String(src).split('/').pop() + ':' + line + ':' + col);
  return false;
};
window.addEventListener('unhandledrejection', function (e) {
  show('PROMISE REJECT: ' + (e && e.reason && e.reason.message ? e.reason.message : e.reason));
});
// Game.loop() глушит ошибки кадров через console.error — перехватываем
var origErr = console.error.bind(console);
console.error = function () {
  var parts = [];
  for (var i = 0; i < arguments.length; i++) {
    var a = arguments[i];
    parts.push(a && a.message ? (a.message + ' @' + (a.stack || '').split('\n')[1]) : String(a));
  }
  show('console.error: ' + parts.join(' '));
  origErr.apply(null, arguments);
};
</script>

<script src="../../www/js/helpers.js"></script>
<script src="../../www/js/gopher.js"></script>
<script src="../../www/js/characters.js"></script>
<script src="../../www/js/system.js"></script>
<script src="../../www/js/game_content.js"></script>
<script src="../../www/js/game_room.js"></script>
<script src="../../www/js/game_scenery.js"></script>
<script src="../../www/js/audio.js"></script>
<script src="../../www/js/game_menu.js"></script>
<script src="../../www/js/game_map.js"></script>
<script src="../../www/js/game_home.js"></script>
<script src="../../www/js/game_shop.js"></script>
<script src="../../www/js/game_minigames.js"></script>
<script src="../../www/js/game_quiet.js"></script>
<script src="../../www/js/game_aerial.js"></script>
<script src="../../www/js/game_stats.js"></script>
<script src="../../www/js/game_clinic.js"></script>
<script src="../../www/js/game_visit.js"></script>
<script src="../../www/js/game_friends.js"></script>
<script src="../../www/js/game.js"></script>

<script>
// Стенд: синхронно (до первой отрисовки браузера) открывает сцену из hash,
// при необходимости «нажимает» кнопку и снимает статистику пикселей.
// Формат: #сцена[@действие][@tutorial]   пример: #home@feed
(function () {
  function report(obj) { document.getElementById('report').textContent = JSON.stringify(obj); }

  function pixelStats(g) {
    var data = g.ctx.getImageData(0, 0, g.width, g.height).data;
    var colors = {}, distinct = 0, sum = 0, samples = 0, max = 0;
    for (var i = 0; i < data.length; i += 4 * 7) {
      var r = data[i], gg = data[i + 1], b = data[i + 2];
      var key = (r >> 4) + ',' + (gg >> 4) + ',' + (b >> 4);
      if (!colors[key]) { colors[key] = 0; distinct++; }
      colors[key]++;
      sum += r * 0.299 + gg * 0.587 + b * 0.114;
      samples++;
    }
    for (var k in colors) if (colors[k] > max) max = colors[k];
    var bg = Math.round(max / samples * 100);
    return {
      scene: g.currentScene,
      distinctColors: distinct,
      meanLuminance: Math.round(sum / samples),
      dominantSharePct: bg,
      nonBackgroundPct: 100 - bg,
      samples: samples
    };
  }

  // Флаги-маркеры (jpeg/hires/sleeping) можно ставить в любом месте хеша —
  // в том числе после '~' (visit~art_museum@jpeg@hires). Вынимаем их до
  // разбора сцены, иначе флаг уезжал в аргумент сцены, и кадр выходил не тот.
  var flags = { jpeg: false, hires: false, sleeping: false };
  var rawHash = decodeURIComponent(location.hash.slice(1)) || 'menu';
  var hash = rawHash.replace(/(^|[@~])(jpeg|hires|sleeping)(?=$|[@~])/g, function (m, sep, flag) {
    flags[flag] = true;
    return sep;
  }).replace(/^[@~]+/, '').replace(/[@~]+$/, '') || 'menu';
  var initArg = null;
  var tilde = hash.indexOf('~');
  if (tilde !== -1) { initArg = hash.slice(tilde + 1); hash = hash.slice(0, tilde); }
  var parts = hash.split('@');
  var g;

  try {
    window.setInterval = function () { return 0; };   // чтобы страница стала idle
    g = new Game();
    window.__game = g;
    g.tryFullscreen = function () {};
    AudioSys.init = function () {};
    AudioSys.play = function () {};
    g.init();                                          // реальный запуск игры
    g.loop = function () {};                           // гасим анимационный цикл
  } catch (e) {
    show('BOOT FAIL: ' + e.message + '\n' + (e.stack || '').split('\n').slice(1, 4).join('\n'));
    report({ bootFail: e.message, hash: hash });
    return;
  }

  // Демо-данные: комната с мебелью и пара друзей, чтобы проверять эти сцены.
  // Важно: в комнатах должны быть ВСЕ формы мебели (иначе новая вещь уедет в
  // релиз невидимой), но без свалки — иначе по кадру не понять, что нарисовано.
  try {
    System.resetProgress();          // стенд всегда стартует из одного состояния
    System.coins = 9000;
    ['plant', 'clock', 'lamp', 'carpet', 'painting', 'sofa', 'tv', 'piano', 'fireplace'].forEach(function (id) {
      System.buyFurniture(id, 'living');
    });
    // Мебель в других комнатах — чтобы проверять все четыре
    ['bed', 'toybox', 'wardrobe', 'nightstand', 'mirror', 'shelf', 'aquarium'].forEach(function (id) { System.buyFurniture(id, 'bedroom'); });
    ['table', 'fridge', 'stove', 'microwave', 'stool', 'cupboard', 'samovar'].forEach(function (id) { System.buyFurniture(id, 'kitchen'); });
    ['bath', 'basin', 'toilet', 'duck', 'washer', 'shower', 'towel'].forEach(function (id) { System.buyFurniture(id, 'bathroom'); });
    System.setWall('mint');
    System.setFloor('blue');
    System.setFur('rose');
    System.applyLookTo(g.gopher);
    // Достижения: на кадре #stats@ach видно и открытые, и закрытые. Дни и
    // серия берём «как после месяца игры» — так видно, что долгие ступени
    // ещё закрыты, а близкие уже взяты.
    var pr = System.progress;
    pr.days = 34; pr.streak = 9; pr.bestStreak = 12;
    pr.trips = 14; pr.minigames = 12; pr.quiet = 9; pr.tttWins = 2;
    pr.feeds = 6; pr.washes = 4; pr.plays = 5; pr.sleeps = 8;
    pr.coinsEarned = 2400;
    System.stats.workSkill = 62; System.stats.schoolSkill = 48; System.stats.intelligence = 70;
    System.checkAchievements();
    if (!System.friends.length) {
      System.friends.push(createNPC([]));
      System.friends.push(createNPC(System.friends.map(function (f) { return f.name; })));
    }
  } catch (e) {
    show('seed fail: ' + e.message);
  }

  // Тексты, попавшие на кадр (v1.3.4). Перехватываем fillText: render-check
  // проверяет по ним, что имя героя подставлено («Милка», а не «Гофер») и что
  // ни в одной подписи не осталось шаблона «{pet…}».
  var drawn = [];
  (function hookText(ctx) {
    var orig = ctx.fillText;
    ctx.fillText = function (text) {
      // Записываем то, что реально увидит ребёнок: petFill уже подставил героя
      var shown = (typeof petFill === 'function') ? petFill(text) : text;
      if (typeof shown === 'string' && drawn.indexOf(shown) === -1) drawn.push(shown);
      return orig.apply(this, arguments);
    };
  })(g.ctx);

  try {
    // Флаг «jpeg»: картинка без альфа-канала — так требуют карточки магазинов
    // (Google Play: JPEG или 24-bit PNG без альфы).
    var asJpeg = flags.jpeg;
    // Флаг «hires»: кадр для карточки магазина — логический размер 540×960
    // (как на телефоне), а битмап 1080×1920. Размеры задаём ЯВНО: у headless
    // Chrome окно и вьюпорт не совпадают, и кадр получался 1080×1746.
    var hires = flags.hires;
    if (hires) {
      g.width = 540;
      g.height = 960;
      g.canvas.width = 1080;
      g.canvas.height = 1920;
      g.ctx.setTransform(2, 0, 0, 2, 0, 0);
      // Страховка: позднее событие resize не должно вернуть канвас к окну
      g.resize = function () {};
    }
    // Флаг «sleeping»: кадр со спящим питомцем (#map@sleeping, #home@sleeping)
    if (flags.sleeping) {
      System.isSleeping = true;
      System.stats.energy = 45;
    }
    // Аргумент «look=…»: надеть на героя наряды прямо в кадре (#home~look=char:milka,hat:cap)
    // — так видно, что наряды садятся на любого героя, а не только на гофера.
    if (initArg && initArg.indexOf('look=') === 0) {
      var wantChar = null;
      initArg.slice(5).split(',').forEach(function (pair) {
        var kv = pair.split(':');
        var key = (kv[0] || '').trim(), val = (kv[1] || '').trim();
        if (!key || !val) return;
        if (key === 'char') { System.setCharacter(val); wantChar = val; }
        else if (key === 'fur') System.setFur(val);
        else if (System.OUTFIT_SLOT_DEFAULT.hasOwnProperty(key)) System.setOutfit(key, val === 'none' ? null : val);
      });
      if (wantChar && typeof g.ensureCharacter === 'function') g.ensureCharacter();
      System.applyLookTo(g.gopher);
      initArg = null;      // дальше — обычное поведение сцены
    }
    // Аргумент «stats=…»: выставить шкалы для кадра (#home~stats=calm-15,hunger-25).
    // Нужен, чтобы глазами увидеть КРАЙНИЕ состояния: все полоски устроены
    // одинаково («чем больше, тем лучше»), поэтому и выглядят одинаково.
    // Значение отделяется «-» (двоеточие нельзя: оно ломает имя файла кадра в
    // macOS — файл молча не сохраняется). Для «calm» значение задаётся как
    // спокойствие (внутри это 100 − стресс).
    if (initArg && initArg.indexOf('stats=') === 0) {
      initArg.slice(6).split(',').forEach(function (pair) {
        var parts = pair.split(/[-:]/);
        var key = (parts[0] || '').trim(), val = parseFloat(parts[1]);
        if (!key || isNaN(val)) return;
        val = Math.max(0, Math.min(100, val));
        if (key === 'calm') System.stats.stress = 100 - val;
        else if (System.stats.hasOwnProperty(key)) System.stats[key] = val;
      });
      initArg = null;
    }
    if (parts[0]) g.transitionTo(parts[0], initArg);
    var scene = g.scenes[g.currentScene];
    for (var i = 0; i < 60; i++) scene.update(16);

    // Магазин: вкладка из hash (#shop@decor) + вид товара (#shop@decor:walls)
    var isShopTab = parts[0] === 'shop' &&
      ['food', 'toys', 'clothes', 'decor', 'fun'].indexOf((parts[1] || '').split(':')[0]) !== -1;
    if (isShopTab) {
      scene.currentTab = (parts[1] || '').split(':')[0];
      var sub = (parts[1] || '').split(':')[1];
      if (sub && (sub === 'walls' || sub === 'floors' || sub === 'furniture')) scene.decorKind = sub;
    }

    // Тихие игры: сразу открыть конкретную (#quiet@stars)
    if (parts[0] === 'quiet' && ['stars', 'color', 'fish'].indexOf(parts[1]) !== -1) {
      scene.startGame(parts[1]);
      parts[1] = null;
    }

    // Рыбалка: кадр сразу после поимки (#quiet@fishcatch). Заказчик v1.3.10:
    // «пишет информацию о рыбах — она не влезает в экран, надо не в одну строку».
    // Ловим рыбку по-настоящему (тем же tryFish), чтобы в кадре была живая длинная
    // плашка и было видно, что факт переносится по строкам.
    if (parts[0] === 'quiet' && parts[1] === 'fishcatch') {
      scene.startGame('fish');
      for (var fj = 0; fj < 40; fj++) scene.update(16);
      var sp = (scene.fish.swimmers || []).filter(function (x) {
        return x.kind === 'fish';
      })[0];
      if (sp) {
        scene.fish.state = 'bite';
        scene.fish.biteFish = sp;
        scene.tryFish();
        scene.resultTimer = 4.5;   // плашка успеет попасть в кадр
      }
      parts[1] = null;
    }

    // Воздушная гимнастика: сразу тренировка (#aerial@swing)
    if (parts[0] === 'aerial' && parts[1] === 'swing') {
      scene.payEntry();
      scene.power = 0.5;
      parts[1] = null;
    }

    if (parts[1] && !isShopTab) {
      // Можно нажать несколько кнопок подряд: #friends@codes+open_add
      var clicks = String(parts[1]).split('+');
      for (var ci = 0; ci < clicks.length; ci++) {
        var want = clicks[ci];
        scene = g.scenes[g.currentScene];
        scene.draw(g.ctx);
        var all = (scene.locationButtons || []).concat(scene.buttons || []).concat(scene.roomTabs || []);
        var target = all.filter(function (b) {
          if (b.action === want) return true;
          if ((b.action || '').indexOf(want) !== -1) return true;
          return (b.text || '').indexOf(want) !== -1;
        })[0];
        if (target) g.handleClick(target.x + target.w / 2, target.y + target.h / 2);
        else show('кнопка "' + want + '" не найдена в сцене ' + g.currentScene, '#330');
      }
    }
    if (parts[2] === 'tutorial') g.showTutorial();

    // После всех правок размера контекст мог сброситься — ставим размер и масштаб заново
    if (hires) {
      if (g.canvas.width !== 1080 || g.canvas.height !== 1920) {
        g.canvas.width = 1080;
        g.canvas.height = 1920;
      }
      g.ctx.setTransform(2, 0, 0, 2, 0, 0);
    }

    g.ctx.clearRect(0, 0, g.width, g.height);
    g.scenes[g.currentScene].draw(g.ctx);
    if (g.tutorialVisible) g.drawTutorial();

    var stats = pixelStats(g);
    stats.hash = hash;
    stats.canvas = g.width + 'x' + g.height;
    stats.errors = window.__log.slice();
    stats.drawn = drawn;
    stats.petLeftover = drawn.filter(function (t) { return t.indexOf('{pet') !== -1; });
    report(stats);
    document.getElementById('shot').textContent = asJpeg
      ? g.canvas.toDataURL('image/jpeg', 0.92)
      : g.canvas.toDataURL('image/png');
  } catch (e) {
    show('DRAW FAIL: ' + e.message + '\n' + (e.stack || '').split('\n').slice(0, 5).join('\n'), '#500');
    report({ drawFail: e.message, hash: hash });
  }
})();
</script>
</body>
</html>
